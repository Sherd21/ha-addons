# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: CertWarden client for Home Assistant
version: "2.0.0"
slug: certwarden-ha-client
description: Automatically keeps the Home Assistant TLS certificate up to date from a local CertWarden service (https://www.certwarden.com)
url: "https://github.com/Sherd21/ha-addons/tree/main/certwarden-ha-client"
image: "ghcr.io/sherd21/{arch}-addon-certwarden-ha-client"
arch:
  - aarch64
  - amd64
init: false
# 'boot' and 'stage' are deliberately absent: they would be set to their own
# defaults (auto / stable), and the add-on linter rejects redundant keys.
#
# Run before Home Assistant Core, so a freshly fetched certificate is already
# on disk by the time Core reads it. This one is not a default.
startup: services
# Restarting Core after installing a new certificate needs POST /core/restart.
# The 'homeassistant' role is the least-privileged one that grants /core/.+
hassio_api: true
hassio_role: homeassistant
map:
  - type: ssl
    read_only: false
options:
  server: null
  certificate_name: null
  key_name: null
  certificate_apikey: null
  key_apikey: null
  certificate_update_window_start: "03:00"
  certificate_update_window_end: "05:00"
  check_interval: 10080
  restart_home_assistant: true
  log_level: info
schema:
  server: 'match(^https:\/\/[^\s\/$.?#].[^\s]*$)'
  certificate_name: str
  key_name: str
  certificate_apikey: password
  key_apikey: password
  certificate_update_window_start: str?
  certificate_update_window_end: str?
  check_interval: int(5,43200)?
  restart_home_assistant: bool?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
