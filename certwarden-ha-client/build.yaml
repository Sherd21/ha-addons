# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-dockerfile
# Alpine 3.24 is the current base. Home Assistant only publishes 3.23/3.24 for
# the 64-bit architectures -- armhf, armv7 and i386 stop at 3.22 and Supervisor
# reports all three as deprecated -- so dropping them is what allows this to
# track the current base instead of being held back at 3.22.
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:3.24"
  amd64: "ghcr.io/home-assistant/amd64-base:3.24"
labels:
  org.opencontainers.image.title: "CertWarden client for Home Assistant"
  org.opencontainers.image.description: "Keeps the Home Assistant TLS certificate up to date from a local CertWarden service (https://www.certwarden.com)"
  org.opencontainers.image.source: "https://github.com/Sherd21/ha-addons/"
  org.opencontainers.image.licenses: "Apache-2.0"
