version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The add-on base images are pinned in each add-on's Dockerfile. They used to
  # live in build.yaml, which Dependabot cannot parse, so base image bumps were
  # a manual step until the deprecated build.yaml was dropped.
  - package-ecosystem: "docker"
    directories:
      - "/certwarden-ha-client"
    schedule:
      interval: "weekly"
