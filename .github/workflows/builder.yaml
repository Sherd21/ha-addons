name: Builder

env:
  MONITORED_FILES: "config.yaml Dockerfile run.sh .dockerignore"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets images be built (and optionally published) from any branch before it is
  # merged. Publishing an image notifies nobody -- Supervisor only offers an
  # update when the version key in config.yaml changes on the default branch --
  # so this allows the images to exist before main ever advertises the version,
  # which closes the window where a user could be offered an update that 404s.
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built images to ghcr.io (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      changed: ${{ steps.matrix.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Computed with git rather than a third-party action. Note that every
          # value above is passed through env: -- interpolating attacker
          # controlled data (branch names, and below, filenames) directly into a
          # run: block would let a fork PR execute code on the runner.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Manual run: build everything, there is no diff to consult.
            range=""
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            # First push of a branch: no previous commit to diff against.
            range=""
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi

          if [[ -z "${range}" ]]; then
            files=$(git ls-tree -r --name-only HEAD)
          else
            files=$(git diff --name-only "${range}")
          fi

          echo "Changed files:"
          echo "${files}"

          {
            echo "all<<__EOF__"
            echo "${files}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@ab22029681aa532bfe7de5774a9972d67bfbd2c0

      - name: Build the job matrix
        id: matrix
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
          ADDONS: ${{ steps.addons.outputs.addons }}
        run: |
          # One matrix entry per add-on and architecture that needs rebuilding.
          # Everything the build job needs is resolved here, from the add-on's
          # own config.yaml and Dockerfile, so the build job itself is a single
          # call to the builder action.
          matrix='{"include":[]}'

          for addon in ${ADDONS}; do
            rebuild=false
            for file in ${MONITORED_FILES}; do
              if grep -qxF "${addon}/${file}" <<< "${CHANGED_FILES}"; then
                rebuild=true
                break
              fi
            done
            if [[ "${rebuild}" == "false" ]]; then
              continue
            fi

            image=$(yq '.image' "${addon}/config.yaml")
            version=$(yq '.version' "${addon}/config.yaml")
            if [[ "${image}" == "null" ]]; then
              echo "::warning::${addon} has no image property, skipping build"
              continue
            fi

            # Verified against the base image's Cosign signature before every
            # push. Only a literal reference can be verified, so a Dockerfile
            # that parameterises its base opts out rather than verifying the
            # wrong thing.
            base=$(awk '$1 == "FROM" { print $2; exit }' "${addon}/Dockerfile")
            if [[ "${base}" == *'$'* ]]; then
              base=""
            fi

            for arch in $(yq '.arch[]' "${addon}/config.yaml"); do
              # Built natively, one runner per architecture -- the builder action
              # takes the architecture it is told, so this mapping is what makes
              # the image match its label.
              case "${arch}" in
                amd64) os="ubuntu-24.04" ;;
                aarch64) os="ubuntu-24.04-arm" ;;
                *)
                  echo "::error::${addon}: unsupported architecture ${arch}"
                  exit 1
                  ;;
              esac

              matrix=$(jq -c \
                --arg addon "${addon}" \
                --arg arch "${arch}" \
                --arg os "${os}" \
                --arg image "${image//\{arch\}/${arch}}" \
                --arg version "${version}" \
                --arg base "${base}" \
                '.include += [{
                   addon: $addon, arch: $arch, os: $os,
                   image: $image, version: $version, base: $base
                 }]' <<< "${matrix}")
            done
          done

          jq . <<< "${matrix}"

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          if [[ $(jq '.include | length' <<< "${matrix}") -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No add-on had any monitored files changed (${MONITORED_FILES})"
          fi

  build:
    needs: init
    if: needs.init.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      # Cosign signs with a short-lived certificate issued against this job's
      # OIDC token; there is no signing key to keep.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.addon }} add-on
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ matrix.addon }}
          # Refuse to build on a base image that is not the one Home Assistant
          # signed. Skipped when the add-on opts out (empty) or when nothing is
          # being pushed.
          cosign-base-verify: ${{ matrix.base }}
          cosign-base-identity: "https://github.com/home-assistant/docker-base/.*"
          # Add-ons share this workflow, so the layer cache has to be scoped per
          # add-on as well as per architecture.
          cache-gha-scope: ${{ matrix.addon }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ matrix.version }}
            latest
          # `publish` is a typed boolean and must not be compared against the
          # string 'true': GitHub coerces mixed-type comparisons to numbers, so
          # that comparison is always false and every dispatched run would
          # quietly build without publishing.
          push: ${{ github.event_name == 'push' || inputs.publish }}
          version: ${{ matrix.version }}
