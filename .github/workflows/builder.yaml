name: Builder

env:
  BUILD_ARGS: "--test"
  MONITORED_FILES: "build.yaml config.yaml Dockerfile run.sh .dockerignore"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets images be built (and optionally published) from any branch before it is
  # merged. Publishing an image notifies nobody -- Supervisor only offers an
  # update when the version key in config.yaml changes on the default branch --
  # so this allows the images to exist before main ever advertises the version,
  # which closes the window where a user could be offered an update that 404s.
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built images to ghcr.io (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Computed with git rather than a third-party action. Note that every
          # value above is passed through env: -- interpolating attacker
          # controlled data (branch names, and below, filenames) directly into a
          # run: block would let a fork PR execute code on the runner.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Manual run: build everything, there is no diff to consult.
            range=""
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            # First push of a branch: no previous commit to diff against.
            range=""
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi

          if [[ -z "${range}" ]]; then
            files=$(git ls-tree -r --name-only HEAD)
          else
            files=$(git diff --name-only "${range}")
          fi

          echo "Changed files:"
          echo "${files}"

          {
            echo "all<<__EOF__"
            echo "${files}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@e3fb68ebda13d88a0d695082f471ba2c83d025fb

      - name: Get changed add-ons
        id: changed_addons
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
          ADDONS: ${{ steps.addons.outputs.addons }}
        run: |
          declare -a changed_addons
          for addon in ${ADDONS}; do
            for file in ${MONITORED_FILES}; do
              if grep -qxF "${addon}/${file}" <<< "${CHANGED_FILES}"; then
                if [[ ! "${changed_addons[*]}" =~ ${addon} ]]; then
                  changed_addons+=("\"${addon}\",");
                fi
              fi
            done
          done

          changed=$(echo "${changed_addons[@]}" | rev | cut -c 2- | rev)

          if [[ -n ${changed} ]]; then
            echo "Changed add-ons: $changed";
            echo "changed=true" >> "$GITHUB_OUTPUT";
            echo "addons=[$changed]" >> "$GITHUB_OUTPUT";
          else
            echo "No add-on had any monitored files changed (${MONITORED_FILES})";
          fi

  build:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64", "amd64"]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@e3fb68ebda13d88a0d695082f471ba2c83d025fb
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        env:
          ADDON_IMAGE: ${{ steps.info.outputs.image }}
          ADDON_ARCHS: ${{ steps.info.outputs.architectures }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_ADDON: ${{ matrix.addon }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # The info helper reads config.yaml with `yq -o=json`, so a string value
          # arrives wrapped in literal double quotes. Strip them: the builder action
          # splices these args straight into a shell script, and a stray quote makes
          # it unparseable ("unexpected EOF while looking for matching").
          #
          # The workflow this replaced interpolated the value into the shell
          # unquoted, so the shell consumed the JSON quotes for us -- but that is
          # exactly what let a crafted value inject code, which is why the value now
          # arrives through env: instead.
          #
          # Never write a GitHub expression here, not even inside a comment: they are
          # substituted before the shell sees the script, so an empty one is a parse
          # error that invalidates the whole workflow file.
          image="${ADDON_IMAGE%\"}"
          image="${image#\"}"

          if [[ "${image}" == "null" || -z "${image}" ]]; then
            echo "Image property is not defined, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT";
          elif [[ "${ADDON_ARCHS}" =~ ${MATRIX_ARCH} ]]; then
            echo "build_arch=true" >> "$GITHUB_OUTPUT";
            # Last path segment: ghcr.io/owner/{arch}-addon-x -> {arch}-addon-x
            echo "image=${image##*/}" >> "$GITHUB_OUTPUT";
            if [[ -z "${HEAD_REF}" ]] && [[ "${EVENT_NAME}" == "push" ]]; then
                echo "BUILD_ARGS=" >> "$GITHUB_ENV";
            elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && [[ "${PUBLISH}" == "true" ]]; then
                echo "BUILD_ARGS=" >> "$GITHUB_ENV";
            fi
          else
            echo "${MATRIX_ARCH} is not a valid arch for ${MATRIX_ADDON}, skipping build";
            echo "build_arch=false" >> "$GITHUB_OUTPUT";
          fi

      - name: Login to GitHub Container Registry
        if: env.BUILD_ARGS != '--test'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder@2025.03.0
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "${{ steps.check.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
