name: Lint

# Runs on every branch, not just main. These mistakes are cheap to catch and
# expensive to catch late: a malformed workflow file is rejected by GitHub
# outright, so it cannot be validated by pushing it to main and hoping.
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    name: Actionlint
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Lint workflow files
        # Catches what YAML validation cannot: bad action inputs, bad expression
        # syntax, and shellcheck over each run: block. Notably it reports an
        # empty GitHub expression, which is a parse error that invalidates the
        # whole workflow file even inside a shell comment -- expressions are
        # substituted before the shell ever sees the script.
        # Pinned by digest; a linter has no business auto-updating itself.
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  shellcheck:
    runs-on: ubuntu-latest
    name: Shellcheck
    strategy:
      matrix:
        addon:
          - certwarden-ha-client
          - certmate-ha-client
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Run shellcheck
        # run.sh carries a `#!/usr/bin/with-contenv bashio` shebang, which
        # defeats shellcheck's shell auto-detection. The file declares
        # `# shellcheck shell=bash` to compensate.
        run: shellcheck ${{ matrix.addon }}/run.sh

  addon-linter:
    runs-on: ubuntu-latest
    name: Add-on linter
    strategy:
      matrix:
        addon:
          - certwarden-ha-client
          - certmate-ha-client
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./${{ matrix.addon }}"
